total_capital: 5000
lane_a_ratio: 0.70
lane_b_ratio: 0.30
trading_enabled: false
allow_production_live: false
experiment_id: baseline-hk
# Isolated HK paper pool (USD notional). Never share cash with US pool.
market: HK
runtime:
  active_kernel: legacy
  dual_run: true
  report_publish_source: legacy
  api_read_preference: legacy
costs:
  commission_per_share: 0.0
  commission_per_contract: 0.0
  option_half_spread_bps: 0.0
promotion:
  n_days: 20
  max_halts_per_day: 2
  # PROH-190: 练兵纪元起点（day 0）。此前日报不计入晋级。
  epoch_start: "2026-09-15"
futu:
  host: 127.0.0.1
  port: 11111
  env: staging

lane_a:
  # fixed/watchlist only; never silent-fallback to HK.00700 or US.QQQ.
  symbol: HK.00700
  universe_mode: watchlist
  tech_watchlist_path: logs/lane_a/hk/tech_watchlist.json
  empty_universe_policy: no_trade
  max_universe_names: 3
  orb:
    window_minutes: 15
    breakout_buffer_pct: 0.0
  vwap:
    require_above_for_long: true
    require_below_for_short: true
  regime:
    enabled: false
    min_or_range_pct: 0.001
  risk:
    max_loss_per_trade_pct: 0.01
    max_daily_loss_pct: 0.03
    max_position_pct: 0.25
    allow_add_to_position: false
  paper:
    mode: opend_sim
    fill_slippage_bps: 0.0

lane_b:
  # P0: HK Lane B options structure off; events via news path when available.
  horizon_days: 14
  deploy_window_days: 3
  cooldown_days: 2
  max_notional_pct: 0.25
  max_event_loss: 150
  daily_loss_limit: 200
  structure: straddle
  strangle_otm_pct: 0.05
  strike_step: 0.0
  min_price: 5.0
  min_avg_volume: 0
  require_us: false
  require_options_tradable: false
  analyst_watchlist_path: null
  news_event_path: logs/lane_b/hk/news_events
  calendar:
    source: fixture
    fixture_path: fixtures/earnings_calendar.json
  option_chain:
    source: fixture
    fixture_path: fixtures/option_chains.json
  paper:
    mode: opend_sim
