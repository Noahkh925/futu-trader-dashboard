[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "futu-trader"
version = "0.1.0"
description = "Dual-lane Futu US trading system (ORB+VWAP / earnings options)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pyyaml>=6.0",
    "redis>=5.0",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
dashboard = [
    "streamlit>=1.30",
]

[project.scripts]
futu-dashboard = "dashboard.app:main"
futu-ops-export = "dashboard.ops_export:main"
futu-paper-day = "paper.session:main"
futu-paper-lane-b = "paper.lane_b_session:main"
futu-staging-day = "staging.harness:main"
futu-promotion-check = "research.promotion:main"
futu-attribution = "research.attribution:main"
futu-oos = "research.oos:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
