services:
  - type: web
    name: futu-trader-dashboard
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /_stcore/health
    envVars:
      - key: DASHBOARD_READONLY
        value: "1"
      - key: REPORTS_DIR
        value: fixtures/staging/promotion_ok
      - key: DASHBOARD_PASSWORD
        sync: false
